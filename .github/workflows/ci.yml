name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Права задаёт caller — reusable расширить их не может; без actions:read падает nx-set-shas.
# packages:read обязателен: явный permissions-блок ОБНУЛЯЕТ неперечисленное, а без него
# pnpm install ловит 403 на @omnifield/* даже с публичными пакетами (грабля сниппета брифа).
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  # Node-контур — reusable devopser (skeleton D1): gitleaks + hygiene (sherif) + nx affected.
  # Тулчейн-пины — из нашего package.json.
  #
  # drift-check ВЫКЛЮЧЕН на переходный период (штатный вход reusable, не обход): мы пилот
  # cutover на baser-тулзы (tasker:BRAIN2-36), .devcontainer/ эмитит обвес @omnifield/baser-devbox,
  # и skeleton его конфигами больше не управляет. Сверять их с эталоном skeleton нечем и незачем:
  # чекер парсит артефакт как строгий JSON и падает на комментариях JSONC
  # (`SyntaxError: Unexpected token '/'` — красный CI с 2026-07-26, не связан с содержимым правок).
  # Вернуть в true, когда уход со skeleton завершён и сверять станет нечего.
  node:
    uses: omnifield/devopser/.github/workflows/node-ci.yml@main
    with:
      drift-check: false

  # Python-контур локальный: reusable python-ci появится need-driven — при втором
  # python-потребителе экосистемы (решение devopser briefs/consumer-brainer.md).
  python:
    name: Python (ruff + pytest, ${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      # Каждый python-пакет workspace — свой прогон: пакет без прогона в CI = невидимая дыра.
      matrix:
        pkg: [backend, kernel, bridge]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v6
      # Версия uv — под required-version root pyproject.toml; CPython — из .python-version.
      # Разъезд этих двух чисел = не «старая версия», а ОТКАЗ uv работать вообще
      # (required-version self-enforcing): держать согласованными с pyproject и с
      # объявлением девбокса (.omnifield/omnifield-devbox.yaml).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - name: Sync deps (uv + dev group)
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test (pytest)
        run: uv run pytest -q

# Фикстура: чужой продукт (НЕ brainer) — доказывает, что product/зоны/пины/архитекторы = ДАННЫЕ.
apiVersion: omnifield.dev/v1
kind: harness
product: acme
architects: 2
models:
  architect: model-arch
  owner: model-own
  layer: model-lay
zones:
  alpha:
    paths: [packages/alpha, packages/alpha-shared]
    description: alpha zone
  beta:
    path: services/beta
    description: beta zone (legacy одиночный path — back-compat)
git:
  architect: full
  owner: commit-only
  layer: none
grabli:
  workspace: GRABLI2

# harness.yaml — роль-модель brainer (dogfood-сид, BRAIN2). Данные под ЭТОТ продукт;
# рамка (инварианты ролей) — .claude/agents/*.md. Схема/семантика — kb:BRAIN2-2.
apiVersion: omnifield.dev/v1
kind: harness

product: brainer
architects: 1

models:
  architect: claude-opus-4-8
  owner: claude-opus-4-8
  layer: claude-haiku-4-5-20251001

# Зоны brainer: scope (leaf) → paths[] (BRAIN2-1: массив папок, пути зон disjoint).
zones:
  kernel:
    paths: [packages/kernel]
    description: agent-as-provider шов
  orchestrator:
    paths: [packages/orchestrator]
    description: lifecycle сессий + провайдеры + телеметрия
  backend:
    paths: [packages/backend]
    description: API/BFF
  bridge:
    paths: [packages/bridge]
    description: мост претрансляции
  frontend:
    paths: [packages/frontend]
    description: control-panel дашборд
  harness:
    paths: [packages/harness]
    description: agent-harness плагин (роль-рамка + пресет-сид)

git:
  architect: full
  owner: commit-only
  layer: none

# Слот grabli (BRAIN2-7): затыки/грабли догфуда — в центральный GRABLI2 (под контролем
# architect; старший актуальный, старый GRABLI — легаси).
grabli:
  workspace: GRABLI2

# Слот services (BRAIN2-9): доступ curl'ом (НЕ MCP). Из ЭТОГО devbox работает дверь через хост
# (соседи :8030/:8040 отсюда недоступны). Сэндбокс Bash режет сеть → curl с сэндбоксом off.
services:
  tasker: http://host.docker.internal:8080/api/tasker
  knowledger: http://host.docker.internal:8080/api/knowledger

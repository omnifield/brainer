# harness.yaml — роль-модель brainer (dogfood-сид, BRAIN2). Данные под ЭТОТ продукт;
# рамка (инварианты ролей) — .claude/agents/*.md. Схема/семантика — kb:BRAIN2-2.
apiVersion: omnifield.dev/v1
kind: harness

product: brainer
architects: 1

# Пины моделей по роли. Берём АЛИАСЫ, не снапшоты с датой: алиас едет за выпусками,
# снапшот замораживает сессии на конкретной сборке. Сверено со справочником моделей 2026-07-31.
models:
  architect: claude-opus-5 # $5/$25 за 1M, контекст 1M
  owner: claude-opus-5 # та же цена, что у 4.8, и сильнее на агентном кодинге
  layer: claude-haiku-4-5 # $1/$5 — узкий одноартефактный промпт, контекст 200K

# Зоны brainer: scope (leaf) → paths[] (BRAIN2-1: массив папок, пути зон disjoint).
zones:
  kernel:
    paths: [packages/kernel]
    description: agent-as-provider шов
  orchestrator:
    paths: [packages/orchestrator]
    description: lifecycle сессий + провайдеры + телеметрия
  backend:
    paths: [packages/backend]
    description: API/BFF
  bridge:
    paths: [packages/bridge]
    description: мост претрансляции
  frontend:
    paths: [packages/frontend]
    description: control-panel дашборд
  harness:
    paths: [packages/harness]
    description: обвес agent-harness (роль-рамка + хуки + пресет-сид), @omnifield/brainer-harness

git:
  architect: full
  owner: commit-only
  layer: none

# Слот grabli (BRAIN2-7): затыки/грабли догфуда — в центральный GRABLI2 (под контролем
# architect; старший актуальный, старый GRABLI — легаси).
grabli:
  workspace: GRABLI2

# Слот services (BRAIN2-9): доступ curl'ом (НЕ MCP). С переезда в omnifield-gateway (BRAIN2-11,
# этап 8) devbox — peer сети: соседи видны ПО ИМЕНИ напрямую. Дверь через хост
# (host.docker.internal:8080/api/*) ещё отвечает, но это обход — канон-путь peer-to-peer.
services:
  tasker: http://tasker:8030/tasker
  knowledger: http://knowledger:8040/knowledger

# Слот checkpoints (BRAIN2-58): корень чекпойнтов ролей — состояние прогона переживает сессию
# (контейнеры переезжают и рестартятся). Узел на РОЛЬ, свой ищи среди детей корня; форма записи
# и правила раздела — в самом корне. Не объявлен — харнесс про чекпойнт молчит.
checkpoints:
  workspace: BRAIN2
  root: BRAIN2-55

# Слот pilots (BRAIN2-59): общий раздел пилотов — меха обкатывается ДО каталога канонов
# (kb:MECH). Двусторонний: знание о мехе в knowledger, работа и ступень зрелости в tasker.
# Правила раздела целиком — kb:PILOT-1 (здесь только адрес). Ходит в раздел architect.
pilots:
  tasker: PILOT
  knowledger: PILOT
